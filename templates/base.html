<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c3e50">
    <title>{% block title %}{{ site_name }} - {{ product_name }}{% endblock %}</title>

    <!-- Site icon (Spatial Wings logo) -->
    <link rel="icon" href="{{ url_for('static', filename='image/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='image/favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='image/apple-touch-icon.png') }}">

    <!-- Third-party libraries are self-hosted (static/vendor) and version-pinned -->
    {% if use_map %}
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
    {% endif %}
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <script>window.APP_CONFIG = {{ app_config|tojson }};</script>
    {% if use_map %}
    <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
    {% endif %}
    <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/gis-common.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
